name: Load Test Thresholds

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: Sequenced load scenarios with enforced thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/workflow_load_test
      REDIS_URL: redis://127.0.0.1:6379
      BASE_URL: http://127.0.0.1:3000
      PORT: '3000'
      AUTH_JWT_SECRET: load-test-jwt-secret-0123456789abcdef
      WEBHOOK_SECRET_KEY: load-test-webhook-secret-0123456789abcdef
      RATE_LIMIT_MAX: '100000'
      AUTH_LOGIN_LIMIT: '100000'
      AUTH_REFRESH_LIMIT: '100000'
      WORKER_CONCURRENCY: '10'
      CONCURRENCY: '40'
      DURATION_SECONDS: '30'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API and worker
        run: |
          nohup npx tsx src/api/server.ts > api-server.log 2>&1 &
          nohup npx tsx src/workers/startWorker.ts > worker.log 2>&1 &

      - name: Wait for the API health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf "$BASE_URL/health/live" > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          tail -n 100 api-server.log
          exit 1

      - name: Seed load-test data
        run: npx tsx tests/load/seed.ts

      - name: Run load scenarios and enforce thresholds
        run: node tests/load/run-all.mjs

      - name: Upload load summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-summaries
          path: tests/load/results/
          if-no-files-found: warn

      - name: Show server logs on failure
        if: failure()
        run: |
          tail -n 200 api-server.log || true
          tail -n 200 worker.log || true