name: Deploy smoke

# Starts the API and workers exactly as Render does (node dist/main.js) against a Redis
# with no persistence, runs a workflow end to end, wipes Redis with a restart, and runs
# it again. This is the failure that left the free deployment unable to queue runs.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Single-process start and Redis restart recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/workflow_smoke?replicaSet=rs0
      REDIS_URL: redis://127.0.0.1:6379
      PORT: '3000'
      AUTH_JWT_SECRET: deploy-smoke-jwt-secret-0123456789abcdef
      WEBHOOK_SECRET_KEY: deploy-smoke-webhook-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start MongoDB single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand({ping:1})" > /dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 2
          done

      - name: Start Redis without persistence, like Render's free Key Value
        run: docker run -d --name redis -p 6379:6379 redis:7 redis-server --save "" --appendonly no

      - name: Start the API and workers the way Render does
        run: nohup node dist/main.js > app.log 2>&1 &

      - name: Wait for a healthy instance
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "the instance never became healthy"
          exit 1

      - name: Run a workflow end to end
        run: npx tsx scripts/run-e2e-smoke.mts

      - name: Restart Redis with its data wiped
        run: |
          docker rm -f redis
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --save "" --appendonly no
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then echo "healthy again"; exit 0; fi
            sleep 2
          done
          echo "the instance did not recover after the Redis restart"
          exit 1

      - name: Run a workflow again after the restart
        run: npx tsx scripts/run-e2e-smoke.mts

      - name: Show the app log on failure
        if: failure()
        run: tail -n 200 app.log || true
