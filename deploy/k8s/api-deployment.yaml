apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine-api
  labels:
    app: workflow-engine-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflow-engine-api
  template:
    metadata:
      labels:
        app: workflow-engine-api
    spec:
      containers:
      - name: api
        image: workflow-engine-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REGION
          value: "us-east-1"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: redis-url
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine-api
spec:
  type: ClusterIP
  selector:
    app: workflow-engine-api
  ports:
  - port: 80
    targetPort: 3000
