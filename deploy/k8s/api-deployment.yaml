apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine-api
  labels:
    app: workflow-engine-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workflow-engine-api
  template:
    metadata:
      labels:
        app: workflow-engine-api
    spec:
      containers:
      - name: api
        image: workflow-engine-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REGION
          value: "us-east-1"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: mongodb-uri
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: workflow-engine-secrets
              key: redis-url
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        # Liveness must NOT depend on Mongo/Redis. GET /health returns 503 when a
        # dependency is down, which would make Kubernetes restart every API pod
        # during a brief Mongo/Redis blip. /health/live has no dependency checks.
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        # Readiness does gate traffic on Mongo + Redis (and is what removes a pod
        # from the Service during a dependency outage).
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
      # server.ts handles SIGTERM: stops accepting connections, then closes the
      # queue, Socket.IO and the Mongo connection before exiting.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine-api
spec:
  type: ClusterIP
  selector:
    app: workflow-engine-api
  ports:
  - port: 80
    targetPort: 3000
